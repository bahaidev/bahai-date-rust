[package]
name = "bahai-date"
version = "0.1.0"
edition = "2021"
description = "Baha'i (Badi) date converter CLI"
license = "ISC"
repository = "https://forge.mitch.science/mitcheffendi/bahai-date-rust"
homepage = "https://forge.mitch.science/mitcheffendi/bahai-date-rust"
readme = "README.md"
keywords = ["calendar", "bahai", "badi", "date", "converter"]
categories = ["command-line-utilities", "date-and-time"]

[dependencies]
badi-date = "0.2"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
clap = { version = "4", features = ["derive"] }
